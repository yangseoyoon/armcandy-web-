<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>인트라넷 접속 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="intranet-room.css" />
  </head>
  <body>
    <div class="stage">
      <div class="door-bg">
        <img src="images/intranet/room-bg.png" alt="" />
      </div>

      <!-- 방탈출 게임처럼 캐비닛 쪽을 가리키는 화살표. 누르면 캐비닛 페이지로 이동 -->
      <a class="cabinet-arrow" href="cabinet-women.html" aria-label="캐비닛으로 이동">
        <svg viewBox="0 0 90 60" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 8 L45 45 L82 8" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>

      <button type="button" class="exit-btn" id="exitBtn" aria-label="나가기">
        <img
          class="exit-icon--default"
          src="images/intranet/exit-icon.png"
          alt=""
        />
        <img
          class="exit-icon--hover"
          src="images/intranet/exit-icon-hover.png"
          alt=""
        />
      </button>
    </div>

    <!-- 검정 팝업창은 .stage 바깥(뷰포트 기준 고정)에 둬야 stage의 scale 트랜스폼과 무관하게
사이트 전역에서 항상 동일한 793.1x247.1px 크기로 보인다 -->
    <div class="intranet-modal" id="exitModal" aria-hidden="true">
      <div class="intranet-modal-box">
        <p class="intranet-modal-text">
          ARM CANDY PROGRAM으로 돌아가시겠습니까?
        </p>
        <button
          type="button"
          class="intranet-modal-btn intranet-modal-btn--yes"
          id="exitYes"
        >
          네
        </button>
        <button
          type="button"
          class="intranet-modal-btn intranet-modal-btn--no"
          id="exitNo"
        >
          아니요
        </button>
      </div>
    </div>

    <script src="folder-scale.js"></script>
    <script>
      const exitBtn = document.getElementById('exitBtn');
      const exitModal = document.getElementById('exitModal');

      exitBtn.addEventListener('click', () => {
        exitModal.classList.add('is-open');
      });

      document.getElementById('exitNo').addEventListener('click', () => {
        exitModal.classList.remove('is-open');
      });

      document.getElementById('exitYes').addEventListener('click', () => {
        const entryPage =
          sessionStorage.getItem('intranetEntryPage') || 'apply.html';
        window.location.href = entryPage;
      });
    </script>
  </body>
</html>
