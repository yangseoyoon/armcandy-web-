<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>인트라넷 접속 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="intranet-connected.css" />
  </head>
  <body>
    <div class="stage">

      <div class="door-bg">
        <img src="images/intranet/door-bg.png" alt="" />
      </div>

      <button type="button" class="exit-btn" id="exitBtn" aria-label="나가기">
        <img class="exit-icon--default" src="images/intranet/exit-icon.png" alt="" />
        <img class="exit-icon--hover" src="images/intranet/exit-icon-hover.png" alt="" />
      </button>

    </div>

    <!-- 검정 팝업창은 .stage 바깥(뷰포트 기준 고정)에 둬야 stage의 scale 트랜스폼과 무관하게
         사이트 전역에서 항상 동일한 793.1x247.1px 크기로 보인다 -->
    <div class="intranet-modal is-open" id="connectedModal" aria-hidden="true">
      <div class="intranet-modal-box">
        <p class="connected-text">인트라넷에 접속하셨습니다.</p>
        <button type="button" class="connected-confirm">확인</button>
      </div>
    </div>

    <div class="intranet-modal" id="exitModal" aria-hidden="true">
      <div class="intranet-modal-box">
        <p class="intranet-modal-text">ARM CANDY PROGRAM으로 돌아가시겠습니까?</p>
        <button type="button" class="intranet-modal-btn intranet-modal-btn--yes" id="exitYes">네</button>
        <button type="button" class="intranet-modal-btn intranet-modal-btn--no" id="exitNo">아니요</button>
      </div>
    </div>

    <script src="folder-scale.js"></script>
    <script>
      document.querySelector('.connected-confirm').addEventListener('click', () => {
        document.getElementById('connectedModal').classList.remove('is-open');
      });

      const exitBtn = document.getElementById('exitBtn');
      const exitModal = document.getElementById('exitModal');

      exitBtn.addEventListener('click', () => {
        exitModal.classList.add('is-open');
      });

      document.getElementById('exitNo').addEventListener('click', () => {
        exitModal.classList.remove('is-open');
      });

      document.getElementById('exitYes').addEventListener('click', () => {
        const entryPage = sessionStorage.getItem('intranetEntryPage') || 'apply.html';
        window.location.href = entryPage;
      });
    </script>
  </body>
</html>
