<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>신체 변형 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="folder-women-bodymod.css" />
  </head>
  <body>
    <div class="stage">

      <!-- 캐비닛 배경 -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women-bodymod/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 -->
      <div class="dark-overlay" aria-hidden="true"></div>

      <!-- 열린 파일철 -->
      <div class="open-folder-wrap">
        <a class="open-folder-bg" href="folder-women.html" aria-label="닫기">
          <img src="images/folder-women-bodymod/open-folder.png" alt="" />
        </a>

        <img class="paperclip" src="images/folder-women-bodymod/paperclip.png" alt="" aria-hidden="true" />

        <!-- 인덱스 탭 이미지 4개 -->
        <div class="index-tab index-tab--punishment" aria-hidden="true">
          <img src="images/folder-women-bodymod/tab-punishment.png?v=2" alt="" />
        </div>
        <div class="index-tab index-tab--drugchem" aria-hidden="true">
          <img src="images/folder-women-bodymod/tab-drug-chem.png?v=2" alt="" />
        </div>
        <div class="index-tab index-tab--medical" aria-hidden="true">
          <img src="images/folder-women-bodymod/tab-medical.png?v=2" alt="" />
        </div>
        <div class="index-tab index-tab--bodymod" aria-hidden="true">
          <img src="images/folder-women-bodymod/tab-body-mod.png?v=2" alt="" />
        </div>

        <!-- 인덱스 라벨 4개 -->
        <a class="index-label index-label--punishment" href="folder-women-punishment.html">
          <span>처벌 · 강제</span>
        </a>
        <a class="index-label index-label--drugchem" href="folder-women-drugchem.html">
          <span>약물 · 화학적 통제</span>
        </a>
        <a class="index-label index-label--medical" href="folder-women-medical.html">
          <span>의학적 치료</span>
        </a>
        <a class="index-label index-label--bodymod index-label--active" href="folder-women-bodymod.html">
          <span>신체 변형</span>
        </a>
      </div>

    </div>

    <script src="folder-scale.js"></script>
  </body>
</html>
